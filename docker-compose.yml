# ==============================================================================
# ASRTAVA HMS - Local & Staging Docker Compose Orchestration
# Services: PostgreSQL 16, Redis 7, Backend API, Web Portal
# ==============================================================================

version: '3.8'

services:
  # ----------------------------------------------------------------------------
  # 1. Primary PostgreSQL 16 Database with Row-Level Security (RLS)
  # ----------------------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: asrtava-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-asrtava_prod}
      POSTGRES_USER: ${DB_USER:-asrtava_admin}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-asrtava_secure_pass_2026}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-asrtava_admin} -d ${DB_NAME:-asrtava_prod}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - asrtava-net

  # ----------------------------------------------------------------------------
  # 2. Redis 7 Cache & Background Queue Engine
  # ----------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: asrtava-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD:-asrtava_redis_secure_2026}"]
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-asrtava_redis_secure_2026}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - asrtava-net

  # ----------------------------------------------------------------------------
  # 3. Centralized Node.js & TypeScript Backend API
  # ----------------------------------------------------------------------------
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: asrtava-backend
    restart: unless-stopped
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      PORT: 5000
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-asrtava_prod}
      DB_USER: ${DB_USER:-asrtava_admin}
      DB_PASSWORD: ${DB_PASSWORD:-asrtava_secure_pass_2026}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-asrtava_redis_secure_2026}
      JWT_SECRET: ${JWT_SECRET:-asrtava_production_jwt_secret_min_32_chars_2026!}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:5173,http://localhost}
    ports:
      - "5000:5000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 15s
      timeout: 5s
      retries: 3
    networks:
      - asrtava-net

  # ----------------------------------------------------------------------------
  # 4. Web Portal (Role-Specific Workspaces & Dashboards via Nginx)
  # ----------------------------------------------------------------------------
  web-portal:
    build:
      context: ./apps/web-portal
      dockerfile: Dockerfile
    container_name: asrtava-web-portal
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost/"]
      interval: 15s
      timeout: 3s
      retries: 3
    networks:
      - asrtava-net

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local

networks:
  asrtava-net:
    driver: bridge

