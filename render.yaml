# ============================================================================
# Render Blueprint Specification for ASRTAVA Hospital Management System
# Full-Stack Deployment: PostgreSQL Database + Express Backend API + React Vite Web Portal
# ============================================================================

databases:
  # 1. Managed PostgreSQL Database Instance
  - name: asrtava-postgres
    databaseName: asrtava
    user: asrtava_user
    plan: free # Can upgrade to 'starter' for non-expiring production storage
    region: oregon # Choose: oregon, frankfurt, ohio, singapore

services:
  # 2. Backend Express + TypeScript API Service
  - type: web
    name: asrtava-backend
    runtime: node
    plan: free # Can upgrade to 'starter' for 24/7 always-on service
    region: oregon
    rootDir: .
    buildCommand: npm --prefix backend install && npm --prefix backend run build
    startCommand: npm --prefix backend start
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: DATABASE_URL
        fromDatabase:
          name: asrtava-postgres
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ORIGIN
        value: "*"

  # 3. Web Portal (Frontend React + Vite SPA)
  - type: web
    name: asrtava-web-portal
    runtime: static
    plan: free
    region: oregon
    rootDir: apps/web-portal
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    autoDeploy: true
    routes:
      # Single-Page Application (SPA) redirect rule for client-side routing
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: asrtava-backend
          property: host
