name: ASRTAVA Continuous Integration & Quality Gate

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ----------------------------------------------------------------------------
  # Job 1: Static Analysis, Formatting & TypeScript Compilation
  # ----------------------------------------------------------------------------
  typecheck:
    name: Type Checking (Backend, Web Portal & Mobile)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: |
          npm ci
          cd backend && npm ci
          cd ../apps/web-portal && npm ci
          cd ../patient-mobile && npm ci

      - name: Typecheck Backend
        run: |
          cd backend
          npx tsc --noEmit

      - name: Typecheck Web Portal
        run: |
          cd apps/web-portal
          npx tsc --noEmit

      - name: Typecheck Patient Mobile App
        run: |
          cd apps/patient-mobile
          npx tsc --noEmit

  # ----------------------------------------------------------------------------
  # Job 2: Automated Full-Platform Test Suite (118 Tests Across 12 Suites)
  # ----------------------------------------------------------------------------
  test:
    name: Automated Test Suite & Multi-Tenant Regression
    runs-on: ubuntu-latest
    needs: typecheck
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Backend & Mobile Dependencies
        run: |
          cd backend && npm ci
          cd ../apps/patient-mobile && npm ci

      - name: Run Unified Test Suite
        run: |
          cd backend
          npm test

  # ----------------------------------------------------------------------------
  # Job 3: Web Portal Production Build & Chunk Size Optimization
  # ----------------------------------------------------------------------------
  build-frontend:
    name: Frontend Production Build & Bundle Audit
    runs-on: ubuntu-latest
    needs: typecheck
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Web Portal Dependencies
        run: |
          cd apps/web-portal
          npm ci

      - name: Build Web Portal Static Assets
        run: |
          cd apps/web-portal
          npm run build

      - name: Assert No JavaScript Chunk Exceeds 500 kB
        run: |
          cd apps/web-portal/dist/assets
          for file in *.js; do
            size_kb=$(du -k "$file" | cut -f1)
            echo "Chunk: $file ($size_kb kB)"
            if [ "$size_kb" -gt 500 ]; then
              echo "Error: Chunk $file exceeds 500 kB limit!"
              exit 1
            fi
          done

  # ----------------------------------------------------------------------------
  # Job 4: Container Build Verification (Multi-Stage Dockerfiles)
  # ----------------------------------------------------------------------------
  docker-build:
    name: Docker Image Build & Layer Verification
    runs-on: ubuntu-latest
    needs: [test, build-frontend]
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Backend Container Image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: false
          tags: asrtava-backend:ci-check

      - name: Build Web Portal Container Image
        uses: docker/build-push-action@v5
        with:
          context: ./apps/web-portal
          file: ./apps/web-portal/Dockerfile
          push: false
          tags: asrtava-web-portal:ci-check

